syntax = "proto3";

package one.cloud.benchmark.dataset;

option java_package = "one.cloud.benchmark.dataset";
option java_outer_classname = "PlacementDatasetProtos";

// Files store varint-length-delimited records with dense IDs starting at 1.
message Record {
  oneof payload {
    Header header = 1;
    Alloc alloc = 2;
    Constraints constraints = 3;
    Candidates candidates = 4;
    Resource resource = 5;
    Placement placement = 6;
    Operation operation = 7;
  }
}

message Header {
  uint32 version = 1;
  fixed64 dataset_id = 2;
  uint32 resource_count = 3;
  uint32 alloc_count = 4;
  uint32 constraint_count = 5;
  uint32 candidate_count = 6;
  uint32 placement_count = 7;
  uint32 operation_count = 8;
  uint32 dimension_count = 9;
  uint32 host_count = 10;
  uint64 extent_bytes = 11;
  uint32 alloc_value_count = 12;
  uint32 limit_count = 13;
  uint32 link_count = 14;
  uint32 disk_plan_count = 15;
  uint32 domain_count = 16;
  uint32 device_use_count = 17;
  uint32 candidate_host_count = 18;
  bool synthetic_operations = 19;
  bool replay_from_snapshot = 20;
  Stream stream = 21;
}

enum ResourceType {
  UNSPECIFIED = 0;
  VCORES = 1;
  MEM_MIB = 2;
  LAN_OUT_MBIT = 3;
  LAN_IN_MBIT = 4;
  NVME_GIB = 5;
  NVME_SPINDLES = 6;
  SSD_GIB = 7;
  SSD_SPINDLES = 8;
  HDD_GIB = 9;
  HDD_SPINDLES = 10;
  NVIDIA_GPUS = 11;
  NONPROD_VCORES = 12;
  NONPROD_LAN_OUT_MBIT = 13;
  NONPROD_LAN_IN_MBIT = 14;
  HW_CORES = 15;
  HW_LAN_QUEUES = 16;
  INTEL_GPUS = 17;
  DEVICE_EXTENTS = 18;
  DEVICE_SPINDLES = 19;
  DEVICE_IOPS = 20;
}

enum Stream {
  MODEL = 0;
  SNAPSHOT = 1;
  OPERATIONS = 2;
}

message Alloc {
  uint32 id = 1;
  repeated uint32 type = 2 [packed = true];
  repeated double amount = 3 [packed = true];
}

message Resource {
  uint32 id = 1;
  uint32 alloc = 2;
  uint32 constraints = 3;
}

message Constraints {
  uint32 id = 1;
  Kind kind = 2;
  uint32 parent = 3;
  uint32 ordinal = 4;
  double cpu_power = 5;
  Media media = 6;
  uint32 candidates = 7;
  uint32 pinned_host = 8;
  uint32 group = 9;
  repeated Limit limits = 10;
  repeated Link links = 11;
  repeated DiskPlan disks = 12;
  repeated Domain domains = 13;
  uint32 flags = 14;
  Media alternative_media = 15;
  double alternative_spindles = 16;
}

enum Kind {
  GENERIC = 0;
  HOST = 1;
  NUMA = 2;
  DISK = 3;
  POD = 4;
  SHARD = 5;
}

enum Media {
  MEDIA_UNSPECIFIED = 0;
  HDD = 1;
  SSD = 2;
  NVME = 3;
  MEMDISK = 4;
  ROOTFS = 5;
}

message Candidates {
  uint32 id = 1;
  repeated uint32 host = 2 [packed = true];
}

message Domain {
  uint32 level = 1;
  uint32 value = 2;
}

message Limit {
  uint32 domain = 1;
  uint32 max = 2;
  bool hard = 3;
}

message Link {
  uint32 target = 1;
  uint32 domain = 2;
  Relation relation = 3;
}

enum Relation {
  COLOCATE = 0;
  READY_GROUP = 1;
  SHARED_GROUP = 2;
}

message DiskPlan {
  Media media = 1;
  Layout layout = 2;
  uint64 extents = 3;
  double spindles = 4;
  optional double iops = 5;
  uint32 min_devices = 6;
  uint32 max_devices = 7;
  uint32 min_stripes = 8;
  uint32 max_stripes = 9;
  // Bit 0 reserves the whole device. Bit 1 marks an optional volume.
  uint32 flags = 10;
  uint32 metadata_extents = 11;
  optional double per_device_iops_cap = 12;
}

enum Layout {
  AUTO = 0;
  LINEAR = 1;
  STRIPED = 2;
  RAID1 = 3;
  RAID5 = 4;
  RAID6 = 5;
  RAID10 = 6;
  RAID4 = 7;
}

message Placement {
  uint32 resource = 1;
  uint32 host = 2;
  uint32 numa = 3;
  uint32 alloc = 4;
  repeated DeviceUse devices = 5;
}

message DeviceUse {
  uint32 device = 1;
  uint64 extents = 2;
  double spindles = 3;
  optional double iops = 4;
}

message Operation {
  uint64 time = 1;
  uint32 resource = 2;
  uint32 generation = 3;
  bool create = 4;
}
